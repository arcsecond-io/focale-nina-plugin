name: Release

on:
  push:
    tags: ['v*']

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create a GitHub Release
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"      # e.g. v1.0.0.0
          $v = $tag.TrimStart("v")
          if ($v.Split('.').Count -ne 4) { throw "Tag must be vMAJOR.MINOR.PATCH.BUILD, got $tag" }
          # The tag, the assembly and the manifest must agree, or NINA would show one version and install another.
          $asm = Select-String -Path src/Focale.NINA.Plugin/Properties/AssemblyInfo.cs -Pattern 'AssemblyFileVersion\("([0-9.]+)"\)' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($asm -ne $v) { throw "Tag $tag does not match AssemblyFileVersion $asm" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Ship the net8.0-windows build (NINA 3.2 references): NINA 3.3 runs on .NET 10 and
      # loads it too. The net10.0-windows target only exists for CI's API check.
      - name: Build plugin
        run: |
          dotnet publish src/Focale.NINA.Plugin/Focale.NINA.Plugin.csproj `
            -c Release `
            -f net8.0-windows `
            -o artifacts/plugin

      # Allowlist: the plugin and SQLite (with its Windows native libraries). Anything else
      # in the publish folder (NINA's own build-transitive assets) is provided by NINA.
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $stage = "artifacts/stage"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item artifacts/plugin/Focale.NINA.Plugin.dll, artifacts/plugin/Microsoft.Data.Sqlite.dll, artifacts/plugin/SQLitePCLRaw.*.dll $stage
          foreach ($rid in "win-x64", "win-x86", "win-arm64") {
            $src = "artifacts/plugin/runtimes/$rid"
            if (Test-Path $src) { Copy-Item $src "$stage/runtimes/$rid" -Recurse }
          }
          $zip = "artifacts/Focale.NINA.Plugin-$v.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force

      - name: Stamp manifest
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          ./scripts/build-manifest.ps1 -Version $v -ZipPath "artifacts/Focale.NINA.Plugin-$v.zip" -OutPath "artifacts/manifest.json"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Focale.NINA.Plugin-${{ steps.ver.outputs.version }}.zip
            artifacts/manifest.json
          generate_release_notes: true
          fail_on_unmatched_files: true
