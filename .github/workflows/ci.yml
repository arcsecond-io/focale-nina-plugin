name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The .NET 10 SDK builds both targets; the .NET 8 runtime (preinstalled on
      # windows-latest, pinned here anyway) runs the NINA 3.2 test build.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # NINA's assemblies come from its NuGet packages (NINA.Plugin): 3.2 for the
      # shipped net8.0-windows build, 3.3 for the net10.0-windows check build.
      - name: Restore
        run: dotnet restore Focale.NINA.Plugin.sln

      - name: Build & test (NINA 3.2 and 3.3)
        run: |
          dotnet test tests/Focale.NINA.Plugin.Tests/Focale.NINA.Plugin.Tests.csproj `
            --configuration Release `
            --logger "trx;LogFilePrefix=test-results" `
            --collect:"XPlat Code Coverage"

      # The shipped build is the net8.0-windows one (NINA 3.2 references). Make sure every NINA
      # type and member it uses still exists, signature included, in NINA 3.3 — which loads it
      # too. The net10.0-windows test build holds NINA 3.3 and its dependencies.
      - name: Binary compatibility with NINA 3.3
        run: |
          dotnet run --project tools/NinaCompatCheck -c Release -- `
            src/Focale.NINA.Plugin/bin/Release/net8.0-windows/Focale.NINA.Plugin.dll `
            tests/Focale.NINA.Plugin.Tests/bin/Release/net10.0-windows

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
