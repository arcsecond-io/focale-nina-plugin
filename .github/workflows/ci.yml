name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The test project transitively builds the plugin DLL, which references NINA's host
      # assemblies. Fetch them from the same zip the release workflow uses, gated by the
      # NINA_REF_URL repo variable. Without it, the test job is skipped (not failed) so a
      # fresh fork can run the workflow and see a clear "configure NINA_REF_URL" status.
      - name: Stage NINA reference assemblies
        if: env.NINA_REF_URL != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path lib/nina -Force | Out-Null
          Invoke-WebRequest -Uri $env:NINA_REF_URL -OutFile nina-bin.zip
          Expand-Archive -Path nina-bin.zip -DestinationPath lib/nina -Force
        env:
          NINA_REF_URL: ${{ vars.NINA_REF_URL }}

      - name: Restore
        if: env.NINA_REF_URL != ''
        run: dotnet restore Focale.NINA.Plugin.sln
        env:
          NINA_REF_URL: ${{ vars.NINA_REF_URL }}

      - name: Build & test
        if: env.NINA_REF_URL != ''
        run: |
          dotnet test tests/Focale.NINA.Plugin.Tests/Focale.NINA.Plugin.Tests.csproj `
            --configuration Release `
            --logger "trx;LogFileName=test-results.trx" `
            --collect:"XPlat Code Coverage"
        env:
          NINA_REF_URL: ${{ vars.NINA_REF_URL }}

      - name: Skipped — NINA_REF_URL not configured
        if: env.NINA_REF_URL == ''
        run: |
          echo "::warning::Set the NINA_REF_URL repository variable to a zip of NINA's host DLLs to enable CI builds."
        env:
          NINA_REF_URL: ${{ vars.NINA_REF_URL }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**'
